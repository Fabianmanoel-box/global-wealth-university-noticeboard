{% extends 'notices/base.html' %}

{% block title %}Logout · GWU Notice Board{% endblock %}

{% block content %}

<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-xl shadow-sm border p-8 text-center">
    <div class="text-4xl mb-3">👋</div>
    <h1 class="text-xl font-bold text-gray-900">Sign Out?</h1>
    <p class="text-gray-600 mt-2 text-sm">You sure say you want log out?</p>

    <form method="post" action="{% url 'account_logout' %}" class="mt-6 flex justify-center gap-3">
      {% csrf_token %}
      <button type="submit"
              class="bg-red-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-700">
        Yes, log out
      </button>
      <a href="{% url 'dashboard' %}"
         class="px-6 py-2 rounded-lg font-semibold border hover:bg-gray-50">
        Cancel
      </a>
    </form>
  </div>
</div>

{% endblock %}
