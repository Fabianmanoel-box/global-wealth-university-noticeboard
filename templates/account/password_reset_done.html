{% extends 'notices/base.html' %}

{% block title %}Email Sent · GWU Notice Board{% endblock %}

{% block content %}

<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-xl shadow-sm border p-8 text-center">
    <div class="text-5xl mb-3">📧</div>
    <h1 class="text-2xl font-bold text-gray-900">Check Your Email</h1>
    <p class="text-gray-600 mt-3 text-sm">
      If an account exists for that email, we don send a reset link. Check your inbox (and spam folder).
    </p>
    <a href="{% url 'account_login' %}"
       class="inline-block mt-6 bg-uou text-white px-6 py-2 rounded-lg font-semibold hover:bg-uou-dark">
      Back to Login
    </a>
  </div>
</div>

{% endblock %}
